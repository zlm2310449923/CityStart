<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CityStart 新市民服务平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <header class="hero py-5 mb-4">
    <div class="container">
      <h1>CityStart</h1>
      <p class="mb-0">新市民安居与就业一站式服务平台（课程原型）</p>
    </div>
  </header>
  <main class="container pb-5">
    <div class="row g-4">
      <section class="col-lg-5">
        <div class="card p-4">
          <h2 class="h5">居民状态与服务计划</h2>
          <label class="form-label" for="citizen-id">Citizen ID</label>
          <input class="form-control mb-3" id="citizen-id" value="C1001">
          <button class="btn btn-primary" id="load-plan">生成综合服务计划</button>
        </div>
        <div class="card p-4 mt-4">
          <h2 class="h5">快速创建居住登记</h2>
          <form id="residence-form">
            <input class="form-control mb-2" name="citizen_id" placeholder="Citizen ID" required>
            <input class="form-control mb-2" name="residential_address" placeholder="居住地址" required>
            <input class="form-control mb-3" name="residence_start_date" type="date" required>
            <button class="btn btn-outline-primary" type="submit">提交居住登记</button>
          </form>
        </div>
      </section>
      <section class="col-lg-7">
        <div class="card p-4 h-100">
          <h2 class="h5">API 响应</h2>
          <div id="message" class="alert alert-secondary">等待操作</div>
          <pre id="result" class="bg-dark text-light rounded p-3">{}</pre>
        </div>
      </section>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
