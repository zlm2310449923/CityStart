{% extends "base.html" %}
{% block title %}Housing Subsidy Application - CityStart{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-building-check me-2"></i>Housing Subsidy Application (S5 &amp; S6)</h2>
<div id="alert-area"></div>

<div class="card">
    <div class="card-header bg-primary text-white">Apply for Housing Rental Subsidy</div>
    <div class="card-body">
        <form id="subsidy-form">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="citizen_id" class="form-label">Citizen ID</label>
                    <input type="text" class="form-control" id="citizen_id" placeholder="C1001" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="full_name" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="rental_address" class="form-label">Rental Address</label>
                <input type="text" class="form-control" id="rental_address" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="monthly_rent" class="form-label">Monthly Rent (CNY)</label>
                    <input type="number" class="form-control" id="monthly_rent" step="0.01" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="lease_start" class="form-label">Lease Start Date</label>
                    <input type="date" class="form-control" id="lease_start" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Current Housing Situation</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="owns_property" id="owns_no" value="no" checked>
                    <label class="form-check-label" for="owns_no">Currently renting, no local property</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="owns_property" id="owns_yes" value="yes">
                    <label class="form-check-label" for="owns_yes">Owns local property</label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" id="submit-btn">Submit Application</button>
        </form>
    </div>
</div>

<div class="card mt-4">
    <div class="card-header bg-light">Check Housing Subsidy Eligibility</div>
    <div class="card-body">
        <div class="input-group mb-3">
            <input type="text" class="form-control" id="elig-citizen-id" placeholder="Citizen ID">
            <button class="btn btn-outline-info" id="elig-btn">Check Eligibility</button>
        </div>
        <div id="elig-result"></div>
    </div>
</div>

<div class="card mt-4">
    <div class="card-header bg-light">Query Application</div>
    <div class="card-body">
        <div class="input-group mb-3">
            <input type="text" class="form-control" id="query-app-id" placeholder="Application ID">
            <button class="btn btn-outline-primary" id="query-btn">Query</button>
        </div>
        <div id="query-result"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('subsidy-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    setLoading('submit-btn', true);
    const ownsProperty = document.querySelector('input[name="owns_property"]:checked').value === 'yes';
    const body = {
        citizen_id: document.getElementById('citizen_id').value,
        full_name: document.getElementById('full_name').value,
        rental_address: document.getElementById('rental_address').value,
        monthly_rent: parseFloat(document.getElementById('monthly_rent').value) || 0,
        lease_start: document.getElementById('lease_start').value,
        owns_local_property: ownsProperty
    };
    const result = await apiPost('housing/housing-subsidy-applications', body);
    setLoading('submit-btn', false);
    if (result.ok) {
        const app = result.data || {};
        showAlert('alert-area',
            `Application submitted. Application ID: <code>${escapeHtml(app.application_id || 'N/A')}</code> `
            + `Status: ${statusBadge(app.status)}`, 'success');
        if (app.application_id) {
            document.getElementById('query-app-id').value = app.application_id;
        }
    } else {
        showApiError('alert-area', result, 'Submission failed.');
    }
});

document.getElementById('elig-btn').addEventListener('click', async function() {
    const citizenId = document.getElementById('elig-citizen-id').value.trim();
    if (!citizenId) return;
    const result = await apiPost('housing/housing-eligibility/check', { citizen_id: citizenId });
    if (result.ok) {
        renderJson('elig-result', result.data);
    } else {
        document.getElementById('elig-result').innerHTML =
            `<p class="text-danger mb-0">[${escapeHtml(result.error.code)}] ${escapeHtml(result.error.message)}</p>`;
    }
});

document.getElementById('query-btn').addEventListener('click', async function() {
    const appId = document.getElementById('query-app-id').value.trim();
    if (!appId) return;
    const result = await apiGet(`housing/housing-subsidy-applications/${encodeURIComponent(appId)}`);
    if (result.ok) {
        renderJson('query-result', result.data);
    } else {
        document.getElementById('query-result').innerHTML =
            `<p class="text-danger mb-0">[${escapeHtml(result.error.code)}] ${escapeHtml(result.error.message)}</p>`;
    }
});
</script>
{% endblock %}
