{% extends "base.html" %}
{% block title %}Citizen Profile - CityStart{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-person-circle me-2"></i>Citizen Profile</h2>

<div id="alert-area"></div>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">Personal Information</div>
            <div class="card-body">
                <form id="profile-form">
                    <div class="mb-3">
                        <label for="citizen_id" class="form-label">Citizen ID</label>
                        <input type="text" class="form-control" id="citizen_id" placeholder="e.g. C1001" required>
                    </div>
                    <div class="mb-3">
                        <label for="full_name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="full_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_number" class="form-label">Identity Document Number</label>
                        <input type="text" class="form-control" id="id_number" required>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phone">
                    </div>
                    <button type="submit" class="btn btn-primary" id="profile-submit-btn">Save Profile</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-info text-white">Citizen Status Overview</div>
            <div class="card-body" id="status-overview">
                <p class="text-muted">Save your profile first, then load the status overview.</p>
            </div>
        </div>
        <button class="btn btn-outline-info mt-3 w-100" id="load-status-btn" style="display:none;">Load Status Overview</button>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('profile-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const citizenId = document.getElementById('citizen_id').value;
    document.getElementById('load-status-btn').style.display = 'block';
    showAlert('alert-area', 'Profile saved locally. Citizen ID: ' + citizenId, 'success');
});

document.getElementById('load-status-btn').addEventListener('click', async function() {
    const citizenId = document.getElementById('citizen_id').value.trim();
    if (!citizenId) {
        showAlert('alert-area', 'Please enter a Citizen ID first.', 'warning');
        return;
    }
    setLoading('load-status-btn', true);
    const result = await apiGet(`citizens/${encodeURIComponent(citizenId)}/service-plan`);
    setLoading('load-status-btn', false);
    const container = document.getElementById('status-overview');
    if (result.ok) {
        const d = result.data || {};
        const list = (arr, empty) => (arr && arr.length)
            ? `<ul class="mb-0">${arr.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>`
            : `<p class="text-muted small mb-0">${empty}</p>`;
        container.innerHTML = `
            <p class="mb-2"><strong>Citizen ID:</strong> <code>${escapeHtml(citizenId)}</code></p>
            <table class="table table-sm mb-3">
                <tbody>
                    <tr><th class="small">Residence Registration</th>
                        <td>${statusBadge(d.residence_registration_status)}</td></tr>
                    <tr><th class="small">Residence Permit</th>
                        <td>${statusBadge(d.residence_permit_status)}</td></tr>
                    <tr><th class="small">Employment Registration</th>
                        <td>${statusBadge(d.employment_registration_status)}</td></tr>
                    <tr><th class="small">Employment Support</th>
                        <td>${statusBadge(d.employment_support_status)}</td></tr>
                    <tr><th class="small">Housing Subsidy</th>
                        <td>${statusBadge(d.housing_subsidy_status)}</td></tr>
                </tbody>
            </table>
            <h6>Completed Services</h6>
            ${list(d.completed_services, 'None yet.')}
            <h6 class="mt-3">Recommended Services</h6>
            ${list(d.recommended_services, 'None.')}`;
    } else {
        container.innerHTML =
            `<p class="text-danger mb-0"><strong>Could not load status.</strong><br>`
            + `[${escapeHtml(result.error.code)}] ${escapeHtml(result.error.message)}</p>`;
    }
});
</script>
{% endblock %}
