{% extends "base.html" %}
{% block title %}Residence Registration - CityStart{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-house-door me-2"></i>Residence Registration (S1)</h2>
<div id="alert-area"></div>

<div class="card">
    <div class="card-header bg-primary text-white">Register Your Residence</div>
    <div class="card-body">
        <form id="registration-form">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="citizen_id" class="form-label">Citizen ID</label>
                    <input type="text" class="form-control" id="citizen_id" placeholder="C1001" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="full_name" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="id_number" class="form-label">Identity Document Number</label>
                    <input type="text" class="form-control" id="id_number" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="text" class="form-control" id="phone">
                </div>
            </div>
            <div class="mb-3">
                <label for="current_address" class="form-label">Current Address in Wuhan</label>
                <input type="text" class="form-control" id="current_address" required>
            </div>
            <button type="submit" class="btn btn-primary" id="submit-btn">Submit Registration</button>
        </form>
    </div>
</div>

<div class="card mt-4">
    <div class="card-header bg-light">Query Registration Status</div>
    <div class="card-body">
        <div class="input-group mb-3">
            <input type="text" class="form-control" id="query-citizen-id" placeholder="Enter Citizen ID">
            <button class="btn btn-outline-primary" id="query-btn">Query</button>
        </div>
        <div id="query-result"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('registration-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    setLoading('submit-btn', true);
    const body = {
        citizen_id: document.getElementById('citizen_id').value,
        full_name: document.getElementById('full_name').value,
        id_number: document.getElementById('id_number').value,
        phone: document.getElementById('phone').value,
        current_address: document.getElementById('current_address').value
    };
    const result = await apiPost('residence/residence-registrations', body);
    setLoading('submit-btn', false);
    if (result.ok) {
        const app = result.data || {};
        showAlert('alert-area',
            `Residence registration submitted. Status: ${statusBadge(app.status)}`, 'success');
    } else {
        showApiError('alert-area', result, 'Registration failed.');
    }
});

document.getElementById('query-btn').addEventListener('click', async function() {
    const citizenId = document.getElementById('query-citizen-id').value.trim();
    if (!citizenId) return;
    const result = await apiGet(`residence/residence-registrations/${encodeURIComponent(citizenId)}`);
    if (result.ok) {
        renderJson('query-result', result.data);
    } else {
        document.getElementById('query-result').innerHTML =
            `<p class="text-danger mb-0">[${escapeHtml(result.error.code)}] ${escapeHtml(result.error.message)}</p>`;
    }
});
</script>
{% endblock %}
